name: Verify

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Install NFC native bridge NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "ndk;28.2.13676358"

      - name: Repository quality guard
        run: python3 scripts/quality_guard.py

      - name: Privileged security guard
        run: python3 scripts/security_guard.py

      - name: Commit convention
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3 scripts/commit_guard.py --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            python3 scripts/commit_guard.py --subject "$(git log -1 --format=%s)"
          fi

      - name: Unit tests, lint, and debug APK
        run: >-
          gradle
          :core:privilege:test
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :feature:network-inspection:test
          :companion:hyperos-credential-fix:lintDebug
          :companion:hyperos-credential-fix:assembleDebug
          :companion:background-server:testDebugUnitTest
          :companion:background-server:lintDebug
          :companion:background-server:assembleDebug
          :companion:nfc-tools:testDebugUnitTest
          :companion:nfc-tools:lintDebug
          :companion:nfc-tools:assembleDebug

      - name: JVM coverage report
        run: gradle :app:koverXmlReportDebug

      - name: Core coverage guard
        run: python3 scripts/coverage_guard.py
