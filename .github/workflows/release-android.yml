name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      ROOTTOOLS_KEYSTORE_PATH: /tmp/roottools-android-release.jks
      ROOTTOOLS_KEYSTORE_PASSWORD: ${{ secrets.ROOTTOOLS_KEYSTORE_PASSWORD }}
      ROOTTOOLS_KEY_ALIAS: ${{ secrets.ROOTTOOLS_KEY_ALIAS }}

    steps:
      - name: Validate requested tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == v* ]] || { echo "Release tag must start with v"; exit 2; }

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Restore release signing key
        shell: bash
        env:
          ROOTTOOLS_KEYSTORE_B64: ${{ secrets.ROOTTOOLS_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$ROOTTOOLS_KEYSTORE_B64"
          test -n "$ROOTTOOLS_KEYSTORE_PASSWORD"
          test -n "$ROOTTOOLS_KEY_ALIAS"
          printf '%s' "$ROOTTOOLS_KEYSTORE_B64" | base64 --decode > "$ROOTTOOLS_KEYSTORE_PATH"
          chmod 600 "$ROOTTOOLS_KEYSTORE_PATH"

      - name: Repository quality guard
        run: python3 scripts/quality_guard.py

      - name: Privileged security guard
        run: python3 scripts/security_guard.py

      - name: Unit tests and lint
        run: gradle :app:testDebugUnitTest :app:lintDebug

      - name: Build signed release APK
        run: gradle :app:assembleRelease

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p dist
          OUT="dist/RootTools-Android-${RELEASE_TAG}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "${OUT}.sha256"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--title "RootTools Android ${RELEASE_TAG}" --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* "${args[@]}"
          fi
