name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      ROOTTOOLS_KEYSTORE_PATH: /tmp/roottools-android-release.jks
      ROOTTOOLS_KEYSTORE_PASSWORD: ${{ secrets.ROOTTOOLS_KEYSTORE_PASSWORD }}
      ROOTTOOLS_KEY_ALIAS: ${{ secrets.ROOTTOOLS_KEY_ALIAS }}

    steps:
      - name: Validate requested tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == v* ]] || { echo "Release tag must start with v"; exit 2; }

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match tag to suite version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^rootToolsVersionName=//p' gradle.properties)"
          test -n "$VERSION_NAME"
          [[ "$RELEASE_TAG" == "v${VERSION_NAME}" ]] || {
            echo "Release tag $RELEASE_TAG does not match suite version v${VERSION_NAME}"
            exit 2
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Install NFC native bridge NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "ndk;28.2.13676358"

      - name: Restore release signing key
        shell: bash
        env:
          ROOTTOOLS_KEYSTORE_B64: ${{ secrets.ROOTTOOLS_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$ROOTTOOLS_KEYSTORE_B64"
          test -n "$ROOTTOOLS_KEYSTORE_PASSWORD"
          test -n "$ROOTTOOLS_KEY_ALIAS"
          printf '%s' "$ROOTTOOLS_KEYSTORE_B64" | base64 --decode > "$ROOTTOOLS_KEYSTORE_PATH"
          chmod 600 "$ROOTTOOLS_KEYSTORE_PATH"

      - name: Repository quality guard
        run: python3 scripts/quality_guard.py

      - name: Privileged security guard
        run: python3 scripts/security_guard.py

      - name: Unit tests and lint
        run: >-
          gradle
          :core:privilege:test
          :app:testDebugUnitTest
          :app:lintDebug
          :feature:network-inspection:test
          :companion:hyperos-credential-fix:lintDebug
          :companion:background-server:testDebugUnitTest
          :companion:background-server:lintDebug
          :companion:nfc-tools:testDebugUnitTest
          :companion:nfc-tools:lintDebug

      - name: Build signed suite release APKs
        run: >-
          gradle
          :app:assembleRelease
          :companion:hyperos-credential-fix:assembleRelease
          :companion:background-server:assembleRelease
          :companion:nfc-tools:assembleRelease

      - name: Verify and stage suite APKs
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          mkdir -p dist
          declare -a artifacts=(
            "app/build/outputs/apk/release/app-release.apk|RootTools-Android"
            "companion/background-server/build/outputs/apk/release/background-server-release.apk|RootTools-Background-Server"
            "companion/hyperos-credential-fix/build/outputs/apk/release/hyperos-credential-fix-release.apk|RootTools-HyperOS-Credential-Fix"
            "companion/nfc-tools/build/outputs/apk/release/nfc-tools-release.apk|RootTools-NFC-Lab"
          )
          for artifact in "${artifacts[@]}"; do
            IFS='|' read -r apk product <<< "$artifact"
            test -s "$apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            out="dist/${product}-${RELEASE_TAG}.apk"
            cp "$apk" "$out"
            filename="$(basename "$out")"
            (cd dist && sha256sum "$filename" > "${filename}.sha256")
          done

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--title "RootTools Android ${RELEASE_TAG}" --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* "${args[@]}"
          fi
